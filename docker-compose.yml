services:
  postgres:
    image: postgres:16-alpine   # same major version as production (managed Postgres 16)
    container_name: ota-postgres
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:5432:5432"   # bind to localhost only — DB not exposed to your network
    volumes:
      - pgdata:/var/lib/postgresql/data   # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ota-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]   # persist BullMQ jobs to disk
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SMTP catcher: the API sends booking emails here (SMTP_HOST=127.0.0.1, SMTP_PORT=1025).
  # Web UI: http://127.0.0.1:8025. Production uses SES SMTP instead.
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: ota-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # web UI
    environment:
      MP_MAX_MESSAGES: 500

volumes:
  pgdata:
  redisdata: